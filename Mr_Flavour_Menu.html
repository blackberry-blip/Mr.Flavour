<style>
:root{--red:#f10b0b;--red-dark:#c90000;--page:#f5eaea;--ink:#171717;--muted:#777;--white:#fff;--green:#27834e}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;position:relative;overflow-x:hidden;background:var(--page);color:var(--ink);font-family:Arial,Helvetica,"Noto Sans Devanagari","Nirmala UI","Mukta","Kohinoor Devanagari","Devanagari Sangam MN",sans-serif}
button,input{font:inherit}
.page{position:relative;z-index:1;max-width:1080px;margin:auto;padding:22px 22px 42px}
.decor{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.decor img{position:absolute;height:auto;opacity:.9;filter:drop-shadow(0 14px 22px rgba(90,30,20,.22));user-select:none}
.hero{min-height:205px;background:var(--red);border-radius:42px;padding:24px 26px 25px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 12px 28px rgba(140,0,0,.08)}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.logo{width:72px;height:72px;border-radius:23px;background:#fff;color:#8b4b27;display:grid;place-items:center;font-size:25px;font-weight:900;box-shadow:0 2px 8px #9e000033}
.actions{display:flex;gap:10px;align-items:center}
.lang,.calendar{height:58px;border:0;border-radius:30px;background:#fff;color:#171717;padding:0 19px;font-weight:800;display:flex;align-items:center;gap:10px;cursor:pointer}
.calendar{width:58px;padding:0;justify-content:center;background:#171717;color:#fff;font-size:22px}
.lang .globe{font-size:20px}
.welcome{margin-top:25px}
.restaurant-name{font-size:18px;font-weight:700;margin:0 0 8px;color:#ffe2e2}
.greeting{font-size:clamp(31px,6vw,46px);line-height:1.1;font-weight:900;letter-spacing:-1.5px;margin:0}
html[lang="ne"] .greeting{letter-spacing:0}
.tools{display:flex;gap:12px;align-items:center;margin:27px 0 20px}
.search-wrap{flex:1;min-width:0;height:70px;border:1px solid #e2dddd;background:#fff;border-radius:40px;display:flex;align-items:center;padding:0 21px;gap:14px;box-shadow:0 2px 4px #00000004}
.search-icon{font-size:23px;color:#777;line-height:1}
#search{width:100%;border:0;outline:0;background:transparent;font-size:17px;color:#222;min-width:0}
#search::placeholder{color:#858585}

/* Veg-only switch */
.veg-switch{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:10px;height:70px;padding:0 18px;background:#fff;border:1px solid #e2dddd;border-radius:40px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;white-space:nowrap;font-weight:800;color:#555}
.veg-switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.vdot{width:16px;height:16px;border:2px solid var(--green);border-radius:3px;display:grid;place-items:center;flex:0 0 auto}
.vdot:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}
.track{position:relative;width:44px;height:26px;border-radius:13px;background:#d6d1d1;transition:background .2s;flex:0 0 auto}
.thumb{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .2s}
.veg-switch input:checked ~ .track{background:var(--green)}
.veg-switch input:checked ~ .track .thumb{transform:translateX(18px)}
.veg-switch input:checked ~ .vlabel{color:#176d3b}
.veg-switch:has(input:checked){background:#e9f5ed;border-color:#bfe0cb}
.veg-switch input:focus-visible ~ .track{outline:3px solid var(--ink);outline-offset:2px}

.category-nav{display:flex;gap:12px;overflow-x:auto;padding:5px 0 18px;scrollbar-width:none}
.category-nav::-webkit-scrollbar{display:none}
.category-nav button{flex:0 0 auto;min-width:83px;border:0;background:transparent;color:#555;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:700;cursor:pointer}
.category-nav .circle{width:76px;height:76px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:27px;border:3px solid transparent;box-shadow:0 2px 8px #00000008}
.category-nav button.active .circle{background:#171717;border:4px solid var(--red);color:#fff}
.section-title{font-size:27px;letter-spacing:-.8px;font-weight:900;margin:17px 0 15px}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;align-items:start}
.category-block{scroll-margin-top:15px}
.category-heading{display:flex;align-items:center;gap:10px;margin:12px 2px 12px}
.category-heading h2{font-size:22px;margin:0;font-weight:900;letter-spacing:-.5px}
.category-heading:after{content:"";height:1px;background:#dfd4d4;flex:1}
.menu-card{background:rgba(255,255,255,.84);border-radius:23px;padding:16px 18px;margin-bottom:13px;box-shadow:0 3px 13px #00000005}
.menu-card h3{font-size:15px;color:var(--red-dark);margin:0 0 9px;font-weight:900;letter-spacing:.5px}
.dish{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:7px 0;border-bottom:1px solid #f0eded;font-size:14px;line-height:1.4}
.dish:last-child{border-bottom:0}
.dish-name{font-weight:600}
.price{font-weight:800;white-space:nowrap}
.combo-price{margin-top:12px;background:#171717;color:#fff;border-radius:14px;padding:11px 14px;text-align:center;font-weight:900;font-size:15px}
.no-results{grid-column:1/-1;background:rgba(255,255,255,.9);border-radius:22px;padding:35px;text-align:center;color:#777}
.footer{text-align:center;color:#777;font-size:12px;padding:30px 0 0;line-height:1.6}
.footer strong{color:var(--red);letter-spacing:2px}
@media(max-width:700px){
 .page{padding:16px 16px 32px}
 .hero{min-height:228px;border-radius:38px;padding:19px 20px 24px}
 .logo{width:72px;height:72px;border-radius:22px}
 .welcome{margin-top:24px}
 .restaurant-name{font-size:16px}
 .greeting{font-size:39px}
 .tools{gap:9px;margin:26px 0 17px}
 .search-wrap{height:72px;padding:0 17px;gap:11px}
 #search{font-size:15px}
 .veg-switch{height:72px;padding:0 13px;gap:8px;font-size:13px}
 .track{width:40px;height:24px;border-radius:12px}
 .thumb{width:18px;height:18px}
 .veg-switch input:checked ~ .track .thumb{transform:translateX(16px)}
 .category-nav{gap:8px;margin-right:-16px}
 .category-nav button{min-width:76px;font-size:12px}
 .category-nav .circle{width:72px;height:72px}
 .section-title{font-size:25px;margin-top:14px}
 .menu-grid{grid-template-columns:1fr;gap:0}
 .category-heading h2{font-size:21px}
}
@media(max-width:390px){
 .hero{padding:17px;border-radius:32px}
 .lang{height:52px;padding:0 13px}
 .calendar{width:52px;height:52px}
 .logo{width:64px;height:64px}
 .greeting{font-size:34px}
 .vdot{display:none}
 .veg-switch{padding:0 11px;font-size:12px}
}

/* Opening splash (CSS-only timing, transform/opacity only) */
#splash{position:fixed;inset:0;z-index:100;background:var(--red);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;animation:splashOut .65s cubic-bezier(.7,0,.25,1) 1.9s forwards;will-change:transform}
.s-logo{position:relative;width:96px;height:96px;border-radius:30px;background:#fff;color:#8b4b27;display:grid;place-items:center;font-size:34px;font-weight:900;box-shadow:0 8px 24px #7a000044;animation:logoPop .7s cubic-bezier(.34,1.56,.64,1) .1s both}
.s-logo:after{content:"";position:absolute;inset:0;border-radius:30px;border:3px solid #fff;animation:ring 1.2s ease-out .6s both}
.s-name{font-size:30px;font-weight:900;letter-spacing:-.5px;animation:riseIn .55s ease-out .55s both}
.s-tag{font-size:14px;font-weight:600;color:#ffe2e2;animation:riseIn .55s ease-out .8s both}
.s-dots{display:flex;gap:7px;margin-top:10px;animation:riseIn .4s ease-out 1s both}
.s-dots i{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.4;animation:dot .9s ease-in-out infinite}
.s-dots i:nth-child(2){animation-delay:.15s}.s-dots i:nth-child(3){animation-delay:.3s}
.hero .welcome,.tools{animation:riseIn .6s ease-out 2.1s both}
@keyframes logoPop{from{transform:scale(0) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.9);opacity:0}}
@keyframes riseIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes dot{50%{opacity:1;transform:translateY(-4px)}}
@keyframes splashOut{to{transform:translateY(-105%);border-radius:0 0 50% 50% / 0 0 8% 8%;visibility:hidden}}
.nosplash #splash{display:none}
.nosplash .hero .welcome,.nosplash .tools{animation:none}
@media (prefers-reduced-motion:reduce){#splash{display:none}.hero .welcome,.tools{animation:none}}
@media print{
 #splash{display:none}
 .decor{display:none}
 body{background:#fff}
 .hero{border-radius:20px;box-shadow:none;print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .tools,.category-nav{display:none}
 .menu-grid{display:block}
 .menu-card{break-inside:avoid;border:1px solid #eee}
}
</style>
</head>

<div id="splash" aria-hidden="true"><div class="s-logo">MF</div><div class="s-name" id="sName">Mr. Flavour</div><div class="s-tag" id="sTag"></div><div class="s-dots"><i></i><i></i><i></i></div></div>

const OVERRIDE = {

 'aloo paratha with curd':'दहीसँग आलु पराठा',
 'paneer paratha with curd':'दहीसँग पनिर पराठा',

};
const DEV_DIGITS = '०१२३४५६७८९';
const toDev = s => s.replace(/\d/g, d => DEV_DIGITS[d]);

function translate(text) {
 if (lang === 'en') return text;
 const key = text.toLowerCase();
 if (OVERRIDE[key]) return OVERRIDE[key];
 let t = text
  .replace(/mr\.?\s*flavour/gi, 'MrFlavour')
  .replace(/hot\s*&\s*sour/gi, 'HotSour')
  .replace(/hot\s*wings/gi, 'Hotwings')
  .replace(/hot\s*pot/gi, 'Hotpot')
  .replace(/non-?\s?vegetarian/gi, 'NonVegetarian')
  .replace(/non-?\s?veg/gi, 'NonVeg')
  .replace(/fried rice/gi, 'FriedRice')
  .replace(/&/g, ' & ');
 t = t.replace(/[\p{L}]+|&/gu, w => GLOSSARY[w.toLowerCase()] ?? w);
 return toDev(t.replace(/\s{2,}/g, ' ').trim());
}
const num = s => lang === 'ne' ? toDev(s) : s;

function foodType(item, section) {
 const text = (item.name + ' ' + section.name).toLowerCase();
 if (/veg\s*\/\s*non.?veg|non.?veg\s*\/\s*veg/.test(text)) return 'both';
 if (/chicken|mutton|fish|prawn|sausage|egg|omelet|bhurji|keema|meat|non.?veg|pork|bacon|duck/.test(text)) return 'nonveg';
 if (/veg|paneer|mushroom|aloo|potato|corn|fruit|dal|papad|bhatas|peanut|chauchau|jeera|lassi|salad|plain rice|jeera rice|roti|naan|thukpa/.test(text)) return 'veg';
 if (/non.?veg/.test(section.name.toLowerCase())) return 'nonveg';
 if (/veg/.test(section.name.toLowerCase())) return 'veg';
 return 'veg';
}

/* ---------- Greeting by time of day (works offline: uses device clock) ---------- */
function greetingIndex() {
 const hour = new Date().getHours();
 return hour < 12 ? 0 : hour < 17 ? 1 : 2;
}
function updateGreeting() {
 document.getElementById('greeting').textContent = UI[lang].greet[greetingIndex()];
}

/* ---------- Static text ---------- */
function applyUI() {
 const t = UI[lang];
 document.getElementById('sName').textContent = t.name;
 document.getElementById('sTag').textContent = t.foot1;
 document.documentElement.lang = lang;
 document.title = t.title;
 searchInput.placeholder = t.search;
 document.getElementById('menuTitle').textContent = t.menu;
 document.getElementById('vegLabel').textContent = t.vegOnly;
 document.getElementById('langLabel').textContent = t.langBtn;
 document.getElementById('restName').textContent = t.name;
 document.getElementById('footName').textContent = t.foot;
 document.getElementById('foot1').textContent = t.foot1;
 document.getElementById('foot2').textContent = t.foot2;
 updateGreeting();
}

function scheduleDecorSafe() { if (typeof scheduleDecor === 'function') requestAnimationFrame(() => requestAnimationFrame(scheduleDecor)); }

/* ---------- Render ---------- */
function render() {
 scheduleDecorSafe();
 const query = searchInput.value.trim().toLowerCase();
 menuRoot.innerHTML = '';
 categoryNav.innerHTML = '';
 let any = false;
 MENU.forEach((category, index) => {
  const visibleSections = category.sections.map(section => ({
   ...section,
   items: section.items.filter(item => {
    const type = foodType(item, section);
    const matchesDiet = !vegOnly || type === 'veg' || type === 'both';
    // search matches both English and Nepali text, whichever language is showing
    const hay = (item.name + ' ' + section.name + ' ' + category.title + ' ' +
                 translate(item.name) + ' ' + translate(section.name)).toLowerCase();
    return matchesDiet && hay.includes(query);
   })
  })).filter(section => section.items.length);
  if (!visibleSections.length) return;
  any = true;

  const navButton = document.createElement('button');
  navButton.type = 'button';
  const icon = document.createElement('span');
  icon.className = 'circle';
  icon.textContent = ['☕','🍳','🥪','🥟','🍟','🍛','⭐','🍱'][index % 8];
  const label = document.createElement('span');
  label.textContent = translate(category.title);
  navButton.append(icon, label);
  navButton.addEventListener('click', () => document.getElementById('cat-'+index).scrollIntoView({behavior:'smooth',block:'start'}));
  categoryNav.appendChild(navButton);

  const block = document.createElement('section');
  block.className = 'category-block';
  block.id = 'cat-'+index;
  const heading = document.createElement('div');
  heading.className = 'category-heading';
  const h2 = document.createElement('h2');
  h2.textContent = translate(category.title);
  heading.appendChild(h2);
  block.appendChild(heading);

  visibleSections.forEach(section => {
   const card = document.createElement('div');
   card.className = 'menu-card';
   const h3 = document.createElement('h3');
   h3.textContent = translate(section.name);
   card.appendChild(h3);
   section.items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'dish';
    const name = document.createElement('span');
    name.className = 'dish-name';
    name.textContent = translate(item.name);
    const price = document.createElement('span');
    price.className = 'price';
    price.textContent = item.price ? UI[lang].rs + ' ' + num(item.price) : '';
    row.append(name, price);
    card.appendChild(row);
   });
   if (section.combo) {
    const cp = document.createElement('div');
    cp.className = 'combo-price';
    cp.textContent = UI[lang].only + ' ' + UI[lang].rs + ' ' + num(section.combo);
    card.appendChild(cp);
   }
   block.appendChild(card);
  });
  menuRoot.appendChild(block);
 });
 if (!any) {
  const empty = document.createElement('div');
  empty.className = 'no-results';
  empty.textContent = UI[lang].none;
  menuRoot.appendChild(empty);
 }
}

/* ---------- Events ---------- */
searchInput.addEventListener('input', render);
vegOnlyBox.addEventListener('change', () => {
 vegOnly = vegOnlyBox.checked;
 store.set('mf_veg', vegOnly ? '1' : '0');
 render();
});
document.getElementById('langBtn').addEventListener('click', () => {
 lang = lang === 'en' ? 'ne' : 'en';
 store.set('mf_lang', lang);
 applyUI();
 render();
});
// keep greeting current if the page stays open across morning/afternoon/evening
setInterval(updateGreeting, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) updateGreeting(); });


/* ---------- Background food photos (embedded, offline) ---------- */
const decorRoot = document.getElementById('decor');
const DECOR_POS = [ // [side, rotation deg, size factor]
 ['l',-12,1.00], ['r',9,.95], ['l',7,.85], ['r',-14,1.05], ['r',8,1.00], ['l',-8,.95], ['l',12,1.00], ['r',-7,.9]
];
function layoutDecor() {
 const H = document.body.scrollHeight, W = document.documentElement.clientWidth;
 const mobile = W < 700;
 const base = mobile ? Math.min(W * 0.95, 380) : Math.min(W * 0.34, 520);
 const step = mobile ? 600 : 680;
 decorRoot.innerHTML = '';
 for (let i = 0, y = mobile ? 330 : 300; y < H - 120; i++, y += step) {
  const [side, rot, f] = DECOR_POS[i % DECOR_POS.length];
  const img = document.createElement('img');
  img.src = DECOR[i % DECOR.length];
  img.alt = '';
  img.draggable = false;
  const w = base * f;
  img.style.width = w + 'px';
  img.style.top = y + 'px';
  img.style[side === 'l' ? 'left' : 'right'] = (mobile ? -w * 0.22 : -w * 0.12) + 'px';
  img.style.transform = 'rotate(' + rot + 'deg)';
  decorRoot.appendChild(img);
 }
}
let decorTimer;
function scheduleDecor() { clearTimeout(decorTimer); decorTimer = setTimeout(layoutDecor, 60); }
window.addEventListener('resize', scheduleDecor);

applyUI();
render();
layoutDecor();

// splash: tap to skip, remove from DOM when finished
const splash = document.getElementById('splash');
if (splash) {
 splash.addEventListener('click', () => splash.remove());
 splash.addEventListener('animationend', e => { if (e.target === splash) splash.remove(); });
}
</script>
</body>
